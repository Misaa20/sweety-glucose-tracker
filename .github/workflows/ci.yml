name: Check Sweety
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sweety
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: sweety
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweety -d sweety"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sweety:ci_test_password@localhost:5432/sweety
      TEST_DATABASE_URL: postgresql://sweety:ci_test_password@localhost:5432/sweety_test
      APP_TIMEZONE: Asia/Kolkata
      CLIENT_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:test:setup
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

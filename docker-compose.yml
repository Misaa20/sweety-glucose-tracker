services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sweety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-sweety}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - sweety_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    volumes:
      - sweety_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "127.0.0.1:${DOCKER_APP_PORT:-3001}:3001"
    environment: &app_environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-sweety}:${POSTGRES_PASSWORD:-local_dev_password}@db:5432/${POSTGRES_DB:-sweety}
      PORT: 3001
      CLIENT_ORIGIN: ${DOCKER_CLIENT_ORIGIN:-http://localhost:3001}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      # This Compose setup is for local HTTP use. Set production behind HTTPS.
      NODE_ENV: development
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@sweety.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-SweetyDemo123!}
      DEMO_DOCTOR_EMAIL: ${DEMO_DOCTOR_EMAIL:-doctor@sweety.local}
      DEMO_DOCTOR_PASSWORD: ${DEMO_DOCTOR_PASSWORD:-SweetyDoctor123!}
      REDIS_URL: redis://redis:6379/0
      REPORT_CACHE_TTL: ${REPORT_CACHE_TTL:-300}
      REMINDER_CRON: ${REMINDER_CRON:-0 21 * * *}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    environment: *app_environment
    command: ["node", "server/src/worker.js"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  sweety_data:
  sweety_redis:
